[package]
name = "vidlib-rename"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
vidlib-inventory = { path = "../vidlib-inventory" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-segmentation = "1.12"
unicode-case-mapping = "1"
caseless = "0.2"
deunicode = "1.6"
pcre2-sys = "0.2.10"

[dev-dependencies]
tempfile = "3"
