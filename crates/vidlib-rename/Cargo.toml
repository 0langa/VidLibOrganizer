[package]
name = "vidlib-rename"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
vidlib-inventory = { path = "../vidlib-inventory" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-segmentation = "1.12"
unicode-case-mapping = "1"
caseless = "0.2"
deunicode = "1.6"
pcre2-sys = "0.2.10"
chrono = { version = "0.4", default-features = false, features = ["std", "serde"] }
chrono-tz = "0.10"
iana-time-zone = "0.1"

crc32fast = "1"
md-5 = "0.10"
sha1 = "0.10"
sha2 = "0.10"
blake3 = "1"
uuid = { version = "1", features = ["v4", "serde"] }
rand = "0.9"
csv = "1.3"

[dev-dependencies]
tempfile = "3"
