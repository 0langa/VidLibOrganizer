[package]
name = "vidlib-fileops"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
vidlib-engine = { path = "../vidlib-engine" }
serde = { version = "1.0", features = ["derive"] }
md5 = "0.8"
vidlib-inventory = { path = "../vidlib-inventory" }
vidlib-rename = { path = "../vidlib-rename" }
rusqlite = { version = "0.38", features = ["bundled", "backup"] }
serde_json = "1"

[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "1", features = ["fs"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_Security", "Win32_System_IO", "Wdk_Foundation", "Wdk_Storage_FileSystem"] }

[dev-dependencies]
rusqlite = { version = "0.38", features = ["hooks"] }
tempfile = "3.23"
