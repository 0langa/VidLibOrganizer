[package]
name = "vidlib-tauri"
version.workspace = true
edition.workspace = true
license.workspace = true

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.12", features = [] }
rfd = "0.16"
vidlib-inventory = { path = "../crates/vidlib-inventory" }
vidlib-rename = { path = "../crates/vidlib-rename" }
vidlib-engine = { path = "../crates/vidlib-engine" }
vidlib-fileops = { path = "../crates/vidlib-fileops" }

tempfile = "3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }

[dev-dependencies]
