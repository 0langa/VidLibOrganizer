[package]
name = "vidlib-tauri"
version.workspace = true
edition.workspace = true
license.workspace = true

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
chrono = { version = "0.4", default-features = false, features = ["std"] }
tauri = { version = "2.12", features = [] }
rfd = "0.16"
vidlib-inventory = { path = "../crates/vidlib-inventory" }
vidlib-rename = { path = "../crates/vidlib-rename" }
vidlib-engine = { path = "../crates/vidlib-engine" }
vidlib-fileops = { path = "../crates/vidlib-fileops" }

tempfile = "3"
fs4 = { version = "0.13", default-features = false, features = ["sync"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_UI_Shell_PropertiesSystem"] }
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }

[dev-dependencies]

[target.'cfg(unix)'.dependencies]
libc = "0.2"
